# Cấu hình SMTP để gửi OTP qua email.
# Để trống mail.smtp.host thì ứng dụng chạy ở chế độ DEV: OTP được ghi vào
# <catalina.base>/logs/otp-dev.log và log của Tomcat thay vì gửi thật.
#
# Có thể ghi đè bằng biến môi trường: MAIL_HOST, MAIL_PORT, MAIL_USERNAME,
# MAIL_PASSWORD, MAIL_FROM, MAIL_STARTTLS, MAIL_AUTH.
mail.smtp.host=
mail.smtp.port=587
mail.smtp.username=
mail.smtp.password=
mail.smtp.from=no-reply@shop24162039.local
mail.smtp.starttls=true
mail.smtp.auth=true
mail.smtp.timeout=10000
